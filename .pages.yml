media:
  input: media
  output: /media
  categories: [image]

content:
  - name: projetos
    label: Projetos
    type: collection
    path: content/projetos
    format: json
    filename: "{primary}.json"
    view:
      fields: [titulo, ano, localizacao]
    fields:
      - name: titulo
        label: Nome do projeto
        type: string
        required: true
      - name: publicado
        label: Mostrar no site
        type: boolean
        default: true
      - name: ordem
        label: Ordem na lista (1 aparece primeiro)
        type: number
      - name: capa
        label: Thumbnail (imagem da home)
        type: image
      - name: fotos
        label: Fotos do projeto (na ordem do scroll)
        type: image
        list: true
      - name: texto
        label: Texto curto (aparece no fim da página)
        type: text
      - name: localizacao
        label: Localização
        type: string
      - name: ano
        label: Ano
        type: string
      - name: area
        label: Área (m²)
        type: string
      - name: colaboradores
        label: Colaboradores
        type: text
      - name: fotografia
        label: Fotografia
        type: string
      - name: construcao
        label: Construção
        type: string
      - name: cor_fundo
        label: Cor de fundo da página
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: cor_texto
        label: Cor do texto e do logo
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]

  - name: estudio
    label: Contato e rodapé
    type: file
    path: content/estudio.json
    format: json
    fields:
      - name: nome
        label: Nome do estúdio
        type: string
      - name: responsavel
        label: Arquiteta responsável
        type: string
      - name: descricao
        label: Descrição curta
        type: string
      - name: sobre
        label: Texto da página Sobre
        type: text
      - name: foto_sobre
        label: Foto da página Sobre (Marina)
        type: image
      - name: cidade
        label: Cidade
        type: string
      - name: email
        label: E-mail
        type: string
      - name: telefone
        label: Telefone
        type: string
      - name: instagram
        label: Instagram (só o nome, sem @)
        type: string

  - name: aparencia
    label: Aparência do site
    type: file
    path: content/aparencia.json
    format: json
    fields:
      - name: home_fundo
        label: Home — cor principal do fundo (vazio = verde original da arte)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: home_formas
        label: Home — cor das formas (vazio = laranja original da arte)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: home_logo
        label: Home — cor do logo e do menu (vazio = Cinza)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: projetos_fundo
        label: Página de projetos — cor principal do fundo (vazio = Cinza quente)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: projetos_formas
        label: Página de projetos — cor das formas, triângulo e retângulo (vazio = Cinza frio)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: projetos_texto
        label: Página de projetos — cor do texto e do logo (vazio = Grafite)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: contato_fundo
        label: Página de contato — cor principal do fundo (vazio = Verde musgo)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: contato_formas
        label: Página de contato — cor das formas, faixas e arcos (vazio = Rosa)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
      - name: contato_texto
        label: Página de contato — cor do texto e do logo (vazio = Cinza)
        type: select
        options:
          values: [Grafite, Off White, Cinza, Cinza frio, Cinza quente, Verde musgo, Vinho, Vermelho, Laranja, Rosa, Azul]
